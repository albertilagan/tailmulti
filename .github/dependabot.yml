version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: monthly
    # Engine dependencies follow the pinned Tailscale release, so routine bumps are off.
    # Security updates still open PRs; update Tailscale and its dependency set together by hand.
    open-pull-requests-limit: 0
