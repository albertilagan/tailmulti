name: Draft prerelease

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  app:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 45
    # Signing secrets live only in this environment; protect it with required reviewers.
    environment: release
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ github.ref_name }}
      TAILMULTI_TEAM_ID: ZR86C4659Z
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$MACOS_CERT_P12" ] || { echo "MACOS_CERT_P12 is not set in the release environment" >&2; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n "s/^ *[0-9]*) \([0-9A-F]\{40\}\) \"Developer ID Application: .*($TAILMULTI_TEAM_ID)\"$/\1/p" | head -1)
          [ -n "$identity" ] || { echo "No Developer ID Application identity for team $TAILMULTI_TEAM_ID" >&2; exit 1; }
          echo "TAILMULTI_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
      - name: Notary credentials
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          [ -n "$AC_API_KEY_P8" ] && [ -n "$AC_API_KEY_ID" ] && [ -n "$AC_API_ISSUER_ID" ] ||
            { echo "App Store Connect API key secrets are not set in the release environment" >&2; exit 1; }
          umask 077
          printf '%s' "$AC_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple
        run: ./scripts/package-app.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: |
            dist/Tailmulti-*-macOS.zip
            dist/Tailmulti-*-macOS.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  draft:
    needs: [checks, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact tagged source
        run: python3 scripts/audit-source.py --clean-checkout
      - name: Package source and checksum
        run: python3 scripts/package-source.py "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app
          path: dist
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Drafts do not reserve their tag, so a rerun would otherwise create a duplicate.
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if [ -n "$existing" ]; then
            echo "A release or draft for $RELEASE_TAG already exists; review or delete it first." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Tailmulti-${RELEASE_TAG}-macOS.zip" \
            "dist/Tailmulti-${RELEASE_TAG}-macOS.sha256" \
            "dist/tailmulti-${RELEASE_TAG}-source.tar.gz" \
            "dist/tailmulti-${RELEASE_TAG}-source.sha256" \
            --verify-tag --draft --prerelease --latest=false \
            --title "Tailmulti ${RELEASE_TAG} (prerelease)" \
            --notes-file docs/RELEASE_NOTES.md
