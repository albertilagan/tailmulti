name: Update feed

# Rebuilds the Sparkle appcast from published releases only. Drafts never reach the feed.
on:
  release:
    # edited covers replaced assets on a published release, whose signature and length change.
    types: [published, unpublished, deleted, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release events run on the release's tag, and Pages ignores deployments from tags,
  # so they only ask for a rebuild on the default branch.
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run appcast.yml --ref "$DEFAULT_BRANCH"

  feed:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Collect published update items
        run: |
          mkdir -p items site
          gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.draft == false) | {tag: .tag_name, publishedAt: .published_at, htmlUrl: .html_url, asset: ([.assets[].name | select(endswith("-macOS.appcast.json"))][0])} | select(.asset != null)' \
            > items/releases.jsonl
          python3 - <<'PY'
          import json, pathlib, subprocess
          releases = []
          for line in pathlib.Path("items/releases.jsonl").read_text().splitlines():
              release = json.loads(line)
              target = pathlib.Path("items") / release["tag"]
              subprocess.run(["gh", "release", "download", release["tag"], "--pattern", release["asset"], "--dir", str(target)], check=True)
              item = json.loads((target / release["asset"]).read_text())
              releases.append({"item": item, "publishedAt": release["publishedAt"], "htmlUrl": release["htmlUrl"]})
          pathlib.Path("items/releases.json").write_text(json.dumps(releases))
          PY
          python3 scripts/appcast.py feed --releases items/releases.json --repo "$GH_REPO" --out site/appcast.xml
          cat site/appcast.xml
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: feed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the uploaded artifact to Pages
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.feed.outputs.artifact_id }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments"
          deployment=$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" |
              jq -ce --argjson id "$ARTIFACT_ID" --arg sha "$GITHUB_SHA" \
                '{artifact_id: $id, pages_build_version: $sha, oidc_token: .value} | select(.oidc_token | length > 0)' |
              gh api --method POST "$endpoint" --input -
          )
          id=$(jq -er '.id // (.status_url | split("/") | last)' <<< "$deployment")
          echo "page_url=$(jq -er '.page_url' <<< "$deployment")" >> "$GITHUB_OUTPUT"

          trap 'gh api --method POST "$endpoint/$id/cancel" --silent || true' EXIT
          trap 'exit 1' INT TERM
          for attempt in {1..60}; do
            if status=$(gh api "$endpoint/$id" --jq .status); then
              echo "Pages deployment $id: $status"
              case "$status" in
                succeed) trap - EXIT; exit 0 ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  trap - EXIT; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Pages deployment $id."
          exit 1
