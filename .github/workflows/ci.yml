name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  macos:
    name: macOS source, engine and app
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Reject private or generated files in checkout
        run: python3 scripts/audit-source.py --clean-checkout
      # The Xcode runner image does not put Go on PATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Verify toolchain
        run: |
          /usr/bin/xcrun --sdk macosx --show-sdk-version
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun swift --version
          go version
          python3 --version
      - name: Test and build without activation
        run: ./scripts/check.sh

  source:
    name: Source export on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/audit-source.py --clean-checkout
      - run: python3 scripts/verify-provenance.py
      - run: python3 -m unittest discover -s scripts/tests -v
